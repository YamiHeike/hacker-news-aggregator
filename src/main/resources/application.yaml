server:
  port: 8080
spring:
  application:
    name: hacker-news-aggregator
  datasource:
    url: jdbc:postgresql://localhost:5433/hackernews
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

story-client:
  base-url: https://hacker-news.firebaseio.com/v0