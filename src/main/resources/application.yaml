server:
  port: 8080
spring:
  application:
    name: hacker-news-aggregator
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

story-client:
  base-url: https://hacker-news.firebaseio.com/v0