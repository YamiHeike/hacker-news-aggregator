name: Continous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:25.0.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24
      - name: Build
        run: ./gradlew build
      - name: Test
        run: ./gradlew test